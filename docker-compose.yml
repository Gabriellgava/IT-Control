services:
  postgres:
    image: postgres:17
    container_name: itcontrol-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: itcontrol_homolog

    ports:
      - "5432:5432"

    volumes:
      - postgres17_data:/var/lib/postgresql/data

volumes:
  postgres17_data:
